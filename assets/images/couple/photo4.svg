<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="40%" stop-color="#F5E6D2"/>
      <stop offset="100%" stop-color="#E5D1B8"/>
    </linearGradient>
    <linearGradient id="goldRim3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B8"/>
      <stop offset="40%" stop-color="#C49A55"/>
      <stop offset="80%" stop-color="#E5C378"/>
      <stop offset="100%" stop-color="#8E6928"/>
    </linearGradient>
    <radialGradient id="sunGlow3" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F5E6D2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EEDFCB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="750" fill="url(#cardGrad3)"/>
  
  <!-- Outer Double Gold Frame -->
  <rect x="25" y="25" width="550" height="700" rx="20" fill="none" stroke="url(#goldRim3)" stroke-width="3"/>
  <rect x="35" y="35" width="530" height="680" rx="15" fill="none" stroke="url(#goldRim3)" stroke-width="1" stroke-dasharray="6,4" opacity="0.8"/>

  <!-- Halo Light in Upper Section -->
  <circle cx="300" cy="300" r="180" fill="url(#sunGlow3)"/>

  <!-- Arch Frame Center Piece -->
  <path d="M 120,530 L 120,280 C 120,160 480,160 480,280 L 480,530 Z" fill="#FFF7EC" fill-opacity="0.85" stroke="url(#goldRim3)" stroke-width="2"/>

  <!-- Silhouette & Graphic in Arch -->
  <g transform="translate(300, 340)">
    <!-- Couple Silhouette -->
    <ellipse cx="0" cy="110" rx="120" ry="20" fill="#C49A55" opacity="0.2"/>
    
    <!-- Male Silhouette -->
    <path d="M -35,-80 C -20,-80 -15,-65 -20,-50 C -15,-40 -12,-30 -12,-10 C -12,10 -20,30 -25,50 L -60,110 L 0,110 L -5,40 C -8,20 -10,-10 -5,-30 C 0,-50 -5,-70 -20,-75 Z" fill="#654132" opacity="0.8"/>
    <circle cx="-25" cy="-65" r="18" fill="#654132"/>

    <!-- Female Silhouette with Veil -->
    <circle cx="25" cy="-55" r="16" fill="#654132"/>
    <!-- Veil Flowing -->
    <path d="M 22,-70 C 50,-50 70,0 75,100 C 65,105 50,105 45,90 C 35,60 25,20 18,-20 Z" fill="#FFFDF9" stroke="url(#goldRim3)" stroke-width="1.2" opacity="0.85"/>
    <!-- Dress Flowing -->
    <path d="M 10,-30 C 20,0 35,40 50,110 L -10,110 C 0,50 5,0 10,-30 Z" fill="#8E302A" opacity="0.75"/>

    <!-- Gold Rings / Cross Motif -->
    <circle cx="-12" cy="0" r="10" stroke="url(#goldRim3)" stroke-width="2" fill="none"/>
    <circle cx="2" cy="-4" r="10" stroke="url(#goldRim3)" stroke-width="2" fill="none"/>
  </g>

  <!-- Corner Flourishes -->
  <g stroke="url(#goldRim3)" stroke-width="1.2" fill="none">
    <!-- Top-Left -->
    <path d="M 45,65 C 65,65 65,45 65,45"/>
    <circle cx="50" cy="50" r="2" fill="#C49A55"/>
    <!-- Top-Right -->
    <path d="M 555,65 C 535,65 535,45 535,45"/>
    <circle cx="550" cy="50" r="2" fill="#C49A55"/>
    <!-- Bottom-Left -->
    <path d="M 45,685 C 65,685 65,705 65,705"/>
    <circle cx="50" cy="700" r="2" fill="#C49A55"/>
    <!-- Bottom-Right -->
    <path d="M 555,685 C 535,685 535,705 535,705"/>
    <circle cx="550" cy="700" r="2" fill="#C49A55"/>
  </g>

  <!-- Photo Title Ribbon -->
  <g transform="translate(300, 590)">
    <text x="0" y="0" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="700" fill="#654132" text-anchor="middle" letter-spacing="2">
      A LOVE ORDAINED
    </text>
    <line x1="-100" y1="12" x2="100" y2="12" stroke="url(#goldRim3)" stroke-width="1"/>
    <circle cx="0" cy="12" r="3" fill="#8E302A"/>
    <text x="0" y="34" font-family="'Great Vibes', 'Alex Brush', cursive" font-size="22" fill="#C49A55" text-anchor="middle">
      Blessed with Everlasting Peace
    </text>
    <text x="0" y="58" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#8E302A" text-anchor="middle" letter-spacing="3">
      DAVID &amp; MONICA
    </text>
  </g>
</svg>
