<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7EC"/>
      <stop offset="40%" stop-color="#F5E6D2"/>
      <stop offset="80%" stop-color="#EEDFCB"/>
      <stop offset="100%" stop-color="#E5D1B8"/>
    </linearGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CD"/>
      <stop offset="30%" stop-color="#E5C378"/>
      <stop offset="60%" stop-color="#C49A55"/>
      <stop offset="100%" stop-color="#8E6928"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F5E6D2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E0CDB2" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="shadowEffect" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#4A2E22" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#heroBg)"/>
  
  <!-- Outer Arch Border Frame -->
  <path d="M 60,940 L 60,380 C 60,150 740,150 740,380 L 740,940 Z" fill="url(#softGlow)" stroke="url(#goldArch)" stroke-width="8" filter="url(#shadowEffect)"/>
  <!-- Inner Arch Inset Line -->
  <path d="M 80,920 L 80,390 C 80,180 720,180 720,390 L 720,920 Z" fill="none" stroke="url(#goldArch)" stroke-width="2" stroke-dasharray="6,4" opacity="0.85"/>
  <path d="M 95,905 L 95,400 C 95,205 705,205 705,400 L 705,905 Z" fill="none" stroke="url(#goldArch)" stroke-width="1" opacity="0.6"/>

  <!-- Top Cross Ornament -->
  <g transform="translate(400, 140)">
    <circle cx="0" cy="0" r="28" fill="#FFF7EC" stroke="url(#goldArch)" stroke-width="2"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="url(#goldArch)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="-6" x2="12" y2="-6" stroke="url(#goldArch)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="3" fill="#8E302A"/>
  </g>

  <!-- Cathedral Silhouette / Floral Garland Backdrop -->
  <g opacity="0.25" stroke="#C49A55" stroke-width="1.5" fill="none">
    <circle cx="400" cy="480" r="220"/>
    <circle cx="400" cy="480" r="180" stroke-dasharray="4,6"/>
    <path d="M 220,650 C 280,480 520,480 580,650"/>
  </g>

  <!-- Central Silhouette of Loving Couple -->
  <g transform="translate(400, 500) scale(1.1)">
    <!-- Soft Glow Behind Couple -->
    <ellipse cx="0" cy="-20" rx="140" ry="180" fill="#FFF7EC" opacity="0.85"/>

    <!-- Romantic Couple Silhouette in Warm Antique Bronze / Deep Brown -->
    <!-- Groom (Left) -->
    <path d="M -55,-130 C -35,-130 -30,-115 -35,-95 C -30,-90 -25,-80 -25,-60 C -25,-40 -35,-20 -40,0 L -90,140 L 0,140 L -10,0 C -15,-25 -20,-45 -15,-70 C -10,-85 -10,-105 -25,-120 C -35,-130 -45,-130 -55,-130 Z" fill="#654132" opacity="0.75"/>
    <!-- Groom Head / Hair -->
    <circle cx="-42" cy="-105" r="26" fill="#654132" opacity="0.85"/>

    <!-- Bride (Right) with Veil & Tiara -->
    <!-- Head -->
    <circle cx="28" cy="-90" r="23" fill="#654132" opacity="0.85"/>
    <!-- Delicate Wedding Veil Flowing Down -->
    <path d="M 25,-110 C 60,-90 90,-40 95,80 C 95,130 80,140 70,140 C 60,110 50,50 35,-10 C 25,-45 15,-75 25,-110 Z" fill="#FFF7EC" stroke="url(#goldArch)" stroke-width="1.5" opacity="0.8"/>
    <!-- Bride Gown Flowing -->
    <path d="M 15,-60 C 25,-30 45,20 60,140 L -20,140 C -10,70 5,-20 15,-60 Z" fill="#8E302A" opacity="0.7"/>

    <!-- Heart of Light Between Them -->
    <path d="M -5,-55 C -5,-70 15,-70 15,-55 C 15,-40 -5,-25 -5,-25 C -5,-25 -25,-40 -25,-55 C -25,-70 -5,-70 -5,-55 Z" fill="#C49A55" opacity="0.9"/>
  </g>

  <!-- Luxury Monogram Emblem -->
  <g transform="translate(400, 710)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#FFF7EC" stroke="url(#goldArch)" stroke-width="2" filter="url(#shadowEffect)"/>
    <text x="0" y="8" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="700" fill="#654132" text-anchor="middle" letter-spacing="4">
      DAVID &amp; MONICA
    </text>
  </g>

  <!-- Subtitle Text -->
  <text x="400" y="820" font-family="'Great Vibes', 'Alex Brush', cursive" font-size="36" fill="#C49A55" text-anchor="middle">
    United in Holy Matrimony
  </text>
  <text x="400" y="865" font-family="'Cinzel', 'Montserrat', serif" font-size="20" font-weight="600" fill="#8E302A" text-anchor="middle" letter-spacing="3">
    NOVEMBER 29, 2026
  </text>

  <!-- Bottom Botanical Flourish -->
  <g transform="translate(400, 905)" stroke="url(#goldArch)" stroke-width="1.5" fill="none">
    <line x1="-120" y1="0" x2="120" y2="0"/>
    <circle cx="0" cy="0" r="5" fill="#C49A55"/>
    <circle cx="-120" cy="0" r="3" fill="#C49A55"/>
    <circle cx="120" cy="0" r="3" fill="#C49A55"/>
    <path d="M -50,0 C -30,-15 -10,-10 0,0 C 10,-10 30,-15 50,0"/>
  </g>

  <!-- Corner Flourishes inside Frame -->
  <use href="#cornerFlourish"/>
</svg>
