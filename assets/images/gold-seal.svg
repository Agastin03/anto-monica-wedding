<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Wax Gold Gradient -->
    <radialGradient id="waxGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDF1D6"/>
      <stop offset="25%" stop-color="#E4C078"/>
      <stop offset="55%" stop-color="#C49A55"/>
      <stop offset="85%" stop-color="#8E6928"/>
      <stop offset="100%" stop-color="#5C4113"/>
    </radialGradient>
    
    <!-- Deep Red Wax Variant for optional burgundy vibe -->
    <radialGradient id="waxBurgundy" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BA473E"/>
      <stop offset="45%" stop-color="#8E302A"/>
      <stop offset="85%" stop-color="#5A1B16"/>
      <stop offset="100%" stop-color="#360E0B"/>
    </radialGradient>

    <!-- Bevel / 3D Shadow -->
    <filter id="sealShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#361705" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <linearGradient id="innerRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CD"/>
      <stop offset="50%" stop-color="#C49A55"/>
      <stop offset="100%" stop-color="#694B1B"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="30%" stop-color="#EED08F"/>
      <stop offset="70%" stop-color="#C49A55"/>
      <stop offset="100%" stop-color="#7B5719"/>
    </linearGradient>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Organic Scalloped Wax Border -->
    <path d="M100 12 
      C109 12, 115 15, 122 17 C130 20, 137 20, 144 25 C152 30, 157 33, 163 40 C170 47, 172 53, 177 61 C181 69, 183 75, 186 84 C188 92, 188 100, 187 108 C185 117, 183 124, 179 132 C174 140, 170 146, 164 153 C157 160, 151 165, 142 170 C134 175, 127 178, 118 181 C109 184, 101 185, 92 184 C83 183, 76 181, 67 177 C59 173, 53 169, 45 163 C38 157, 33 151, 28 143 C22 135, 19 128, 17 119 C14 110, 14 102, 15 93 C17 84, 19 77, 24 69 C29 61, 33 55, 41 48 C48 42, 54 37, 63 32 C71 27, 78 24, 87 21 C93 19, 96 12, 100 12 Z" 
      fill="url(#waxGold)"/>

    <!-- Inner Recessed Circle -->
    <circle cx="100" cy="100" r="70" fill="url(#waxGold)" stroke="url(#innerRim)" stroke-width="2.5" opacity="0.95"/>
    <circle cx="100" cy="100" r="66" fill="none" stroke="#7B5719" stroke-width="1" opacity="0.6" stroke-dasharray="2,2"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#innerRim)" stroke-width="1.2" opacity="0.8"/>

    <!-- Laurel Wreath Leaves (Left) -->
    <g stroke="url(#goldText)" stroke-width="1.2" fill="none" opacity="0.85">
      <path d="M56 100 C56 75, 75 58, 92 56"/>
      <!-- Leaves -->
      <path d="M60 92 C56 89, 52 90, 50 94 C53 96, 57 95, 60 92 Z" fill="url(#goldText)"/>
      <path d="M65 82 C61 80, 58 82, 57 86 C60 88, 64 86, 65 82 Z" fill="url(#goldText)"/>
      <path d="M72 73 C68 72, 65 75, 65 79 C68 80, 72 77, 72 73 Z" fill="url(#goldText)"/>
      <path d="M81 66 C78 66, 75 69, 76 74 C79 74, 82 70, 81 66 Z" fill="url(#goldText)"/>
    </g>

    <!-- Laurel Wreath Leaves (Right) -->
    <g stroke="url(#goldText)" stroke-width="1.2" fill="none" opacity="0.85">
      <path d="M144 100 C144 75, 125 58, 108 56"/>
      <!-- Leaves -->
      <path d="M140 92 C144 89, 148 90, 150 94 C147 96, 143 95, 140 92 Z" fill="url(#goldText)"/>
      <path d="M135 82 C139 80, 142 82, 143 86 C140 88, 136 86, 135 82 Z" fill="url(#goldText)"/>
      <path d="M128 73 C132 72, 135 75, 135 79 C132 80, 128 77, 128 73 Z" fill="url(#goldText)"/>
      <path d="M119 66 C122 66, 125 69, 124 74 C121 74, 118 70, 119 66 Z" fill="url(#goldText)"/>
    </g>

    <!-- Mini Top Cross -->
    <path d="M100 50 L100 62 M95 54 L105 54" stroke="url(#goldText)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Monogram: D & M -->
    <text x="73" y="112" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="700" fill="url(#goldText)" text-anchor="middle" letter-spacing="1">D</text>
    <text x="100" y="106" font-family="'Great Vibes', 'Alex Brush', cursive" font-size="28" fill="#FFF7EC" text-anchor="middle" font-style="italic">&amp;</text>
    <text x="127" y="112" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="700" fill="url(#goldText)" text-anchor="middle" letter-spacing="1">M</text>

    <!-- Sub-text ribbon: 2026 -->
    <text x="100" y="132" font-family="'Cinzel', 'Montserrat', serif" font-size="10" font-weight="600" fill="url(#goldText)" text-anchor="middle" letter-spacing="3">29 . XI . 2026</text>

    <!-- Bottom floral bow -->
    <circle cx="100" cy="144" r="2.5" fill="url(#goldText)"/>
    <path d="M96 145 C90 148, 86 147, 84 144" stroke="url(#goldText)" stroke-width="1" fill="none"/>
    <path d="M104 145 C110 148, 114 147, 116 144" stroke="url(#goldText)" stroke-width="1" fill="none"/>
  </g>
</svg>
